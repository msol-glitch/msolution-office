<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="엠솔루션 오피스">
<meta name="theme-color" content="#165ba3">
<style>
:root{--navy:#1B3A6B;--navy2:#274f8f;--bg:#f2f4f8;--line:#dde2ea;--txt:#1d2433;--sub:#667085;--red:#c62828;--amber:#b26a00;--green:#2e7d32;--chip:#eef2f8}
*{box-sizing:border-box}
body{margin:0;font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px}
button.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
button.pri:hover{background:var(--navy2)}
button.ghost{border-color:transparent;background:transparent;color:var(--sub);padding:5px 8px}
button.danger{color:var(--red)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--txt)}
textarea{width:100%;resize:vertical}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;position:sticky;top:0;z-index:5}
header .brand{font-weight:700;letter-spacing:-.3px}
header .sp{flex:1}
header button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.bell{position:relative}
.badge{position:absolute;top:-6px;right:-6px;background:#e53935;color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}

    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);

    else if (k === 'checked') el.checked = !!v;

// 메모 전체 보기(카드·인덱스 클릭)
async function openMemo(id, after) {
  let m; try { m = await rpc('office_memo_get', { p_id: id }); } catch (e) { return toast(e.message, true); }
  let ed; let close;
  const wrap = h('div');
  const mount = mm => { ed = memoEditor(mm, { onSaved: () => { }, onDeleted: () => { close(); after && after(); }, onRestore: r => mount(r) }); put(wrap, ed.el); };
  mount(m);
  close = modal(m.mine ? '내 메모' : `${m.author}님의 공유 메모`, wrap);
  const bg = wrap.closest('.modal-bg'); bg.querySelector('.modal').classList.add('wide');

  obs.observe(document.body, { childList: true });
}

async function authApi(method, path, body) {
  const r = await fetch(CFG.url + '/auth/v1/' + path, { method, headers: { apikey: CFG.key, Authorization: 'Bearer ' + await token(), 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch { j = t; }
  if (!r.ok) throw new Error(errMsg(j, '인증 처리 실패 (' + r.status + ')'));
  return j;
}
async function mfaFactors() { const u = await authApi('GET', 'user'); return (u.factors || []).filter(f => f.factor_type === 'totp'); }
async function mfaVerify(factorId, code) {
  const ch = await authApi('POST', `factors/${factorId}/challenge`);
  const s = await authApi('POST', `factors/${factorId}/verify`, { challenge_id: ch.id, code: String(code).replace(/\s/g, '') });
  setSession(s); // aal2 세션으로 교체
}
function otpInput(onDone) {
  const inp = h('input', { inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: 6, placeholder: '6자리', class: 'otp' });
  inp.oninput = () => { inp.value = inp.value.replace(/\D/g, '').slice(0, 6); if (inp.value.length === 6) onDone(inp.value, inp); };
  inp.onkeydown = e => { if (e.key === 'Enter' && inp.value.length === 6) onDone(inp.value, inp); };
  return inp;
}

  modal(`📇 ${target} 이력카드`, h('div', null,
    h('h4', null, '현재 사양·상태'), h('table', null, h('tr', null, ['항목', '현재 값', '언제부터', '변경 횟수'].map(x => h('th', null, x))),
      d.items.map(i => h('tr', null, h('td', null, i.item), h('td', null, i.type === '정비교체' ? '🔧 최근 교체' : h('b', null, i.current || '')), h('td', null, fmtYMD(i.since)), h('td', null, i.n)))),
    h('h4', null, '전체 이력'), d.timeline.map(e => h('div', { class: 'tl' + (e.voided ? ' voided' : ''), onclick: () => chgOpen(e.id) },
      h('div', { class: 'tld' }, fmtYMD(e.effective_at)), h('div', null, chgBadge(e.change_type), ' ', h('b', null, e.item), ' ', chgValue(e), e.voided ? h('span', { class: 'flag' }, ' 무효') : null,
        h('div', { class: 'muted' }, `${e.doc_no} · ${e.requester || ''} · ${e.author}${e.official_no ? ' · 원청 ' + e.official_no : ''}`)))),
    h('div', { class: 'muted', style: 'margin-top:8px' }, '감사·SQ 대응 시 이 화면을 인쇄(Ctrl+P)하면 됩니다.')),
    c => [h('button', { onclick: () => window.print() }, '인쇄'), h('button', { onclick: c }, '닫기')]);
  document.querySelector('.modal-bg:last-of-type .modal').classList.add('wide');
}

async function chgAsOf() {
  const targets = ST.chgTargets || await rpc('office_chg_targets');
  const at = h('input', { type: 'date', value: toLocalInput(new Date()).slice(0, 10) });
  const tg = h('select', null, h('option', { value: '' }, '전체 대상'), targets.map(t => h('option', null, t.target)));
  const out = h('div');
  const run = async () => {
    const r = await rpc('office_chg_asof', { p: { at: at.value, target: tg.value } });
    put(out, r.rows.length ? h('table', null, h('tr', null, ['대상', '항목', `${r.at} 기준 값`, '언제부터', '근거번호', '그 다음 변경'].map(x => h('th', null, x))),
      r.rows.map(x => h('tr', null, h('td', null, x.target), h('td', null, x.item), h('td', null, h('b', null, x.value || '')), h('td', null, fmtYMD(x.since)),
        h('td', null, h('a', { href: '#', onclick: ev => { ev.preventDefault(); chgOpen(x.id); } }, x.doc_no)), h('td', { class: 'muted' }, x.next ? `${fmtYMD(x.next.at)} → ${x.next.value || '교체'}` : '-')))) : h('div', { class: 'muted' }, '그 날짜 이전 이력이 없습니다.'));
  };
  at.onchange = run; tg.onchange = run;
  modal('🕰 시점 조회 — 그날 어떤 사양이었나', h('div', null, h('div', { class: 'row', style: 'margin-bottom:8px' }, '날짜 ', at, tg, h('button', { class: 'pri', onclick: run }, '조회')),
    h('div', { class: 'muted', style: 'margin-bottom:8px' }, '클레임 LOT의 생산일을 넣으면, 그날 적용 중이던 사양과 이후 바뀐 내용이 나옵니다.'), out));
  document.querySelector('.modal-bg:last-of-type .modal').classList.add('wide');
  run();
}

async function chgCycles() {
  const list = await rpc('office_chg_cycles');
  modal('🔧 교환주기', list.length ? h('div', null, h('table', null, h('tr', null, ['대상', '항목', '횟수', '평균 주기', '최단~최장', '마지막', '다음 예상'].map(x => h('th', null, x))),
    list.map(x => h('tr', null, h('td', null, x.target), h('td', null, x.item), h('td', null, x.count), h('td', null, x.avg_days != null ? x.avg_days + '일' : '-'),
      h('td', { class: 'muted' }, x.min_days != null ? `${x.min_days}~${x.max_days}일` : '-'), h('td', null, fmtYMD(x.last)),
      h('td', { class: x.days_left != null && x.days_left <= 7 ? 'over' : '' }, x.next ? `${fmtYMD(x.next)} (${x.days_left >= 0 ? 'D-' + x.days_left : (-x.days_left) + '일 지남'})` : '2회째부터 계산')))),
    h('div', { class: 'muted', style: 'margin-top:8px' }, '「정비교체」로 등록된 이력 간격으로 계산합니다. 고장 교체와 정기 교체가 섞이면 평균이 흔들리니 계기를 정확히 골라주세요.'))
    : h('div', { class: 'muted' }, '「정비교체」 이력이 2건 이상 쌓이면 주기가 계산됩니다.'));
}

function chgBulk() {
  const ta = h('textarea', { rows: 10, placeholder: '엑셀에서 복사해 붙여넣기 (제목행 없이, 열 순서 고정)\n적용일\t대상\t항목\t이전값\t새값\t구분\t계기\t원청번호\t메모\n2026-11-01\tKA4\t바코드 용지 색상\t흰색\t노랑\t사양변경\t고객사요청\t\t서연이화 메일\n2026-11-03\t라벨프린터 1호기\t헤드\t\t신품\t정비교체\t고장·불량\t\t' });
  modal('변경이력 엑셀 붙여넣기 (기존 이력 이관)', h('div', null, ta, h('div', { class: 'muted' }, '열: 적용일 | 대상 | 항목 | 이전값 | 새값 | 구분(사양변경/4M변동점/정비교체/기타) | 계기 | 원청번호 | 메모 · 한 번에 500건')),
    c => [h('button', { onclick: c }, '취소'), h('button', { class: 'pri', onclick: async () => {
      const rows = parseDelimited(ta.value.trim(), '\t').filter(r => r.length >= 3 && r[1] && r[2]).map(r => {
        const m = String(r[0] || '').match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?/);
        const eff = m ? new Date(+m[1], +m[2] - 1, +m[3], m[4] ? +m[4] : 8, m[5] ? +m[5] : 0).toISOString() : '';
        return { effective_at: eff, target: r[1], item: r[2], before_value: r[3] || '', after_value: r[4] || '', change_type: CHG_TYPES.includes(r[5]) ? r[5] : '사양변경', requester: CHG_REQ.includes(r[6]) ? r[6] : '', official_no: r[7] || '', note: r[8] || '' };
      });
      if (!rows.length) return toast('읽을 행이 없습니다', true);
      if (rows.some(r => !r.effective_at) && !confirm('적용일을 읽지 못한 행은 오늘 날짜로 등록됩니다. 계속할까요?')) return;
      const res = await rpc('office_chg_bulk', { p: { rows } });
      c(); toast(`${res.ok}건 등록${res.errors.length ? ` · ${res.errors.length}건 실패 (${res.errors.slice(0, 3).map(x => x.row + '행: ' + x.error).join(', ')})` : ''}`, res.errors.length > 0); go('changes');
    } }, '등록')]);
}
