<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="엠솔루션 오피스">
<meta name="theme-color" content="#165ba3">
<style>
:root{--navy:#1B3A6B;--navy2:#274f8f;--bg:#f2f4f8;--line:#dde2ea;--txt:#1d2433;--sub:#667085;--red:#c62828;--amber:#b26a00;--green:#2e7d32;--chip:#eef2f8}
*{box-sizing:border-box}
body{margin:0;font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px}
button.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
button.pri:hover{background:var(--navy2)}
button.ghost{border-color:transparent;background:transparent;color:var(--sub);padding:5px 8px}
button.danger{color:var(--red)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--txt)}
textarea{width:100%;resize:vertical}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;position:sticky;top:0;z-index:5}
header .brand{font-weight:700;letter-spacing:-.3px}
header .sp{flex:1}
header button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.bell{position:relative}
.badge{position:absolute;top:-6px;right:-6px;background:#e53935;color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
nav{display:flex;gap:4px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:50px;z-index:4}
nav button{border:none;background:transparent;padding:8px 14px;border-radius:20px;white-space:nowrap;color:var(--sub)}
nav button.on{background:var(--navy);color:#fff}
main{max-width:1200px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--navy)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}
.muted{color:var(--sub);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);color:var(--navy);border-radius:12px;padding:2px 9px;font-size:12px;margin:2px 3px 2px 0;cursor:pointer;border:1px solid transparent}
.chip.line{background:#e3edff}.chip.customer{background:#e8f5e9;color:#1b5e20}.chip.topic{background:#fff3e0;color:#8a4b00}.chip.car{background:#f3e5f5;color:#6a1b9a}.chip.part{background:#e0f2f1;color:#00695c}
.chip.off{opacity:.45;text-decoration:line-through}
.chip.sel{border-color:var(--navy)}
.memo{border:1px solid var(--line);border-left:4px solid #c5ccd8;border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.memo.p1{border-left-color:var(--amber)}.memo.p2{border-left-color:var(--red)}

.memo .body{white-space:pre-wrap;word-break:break-word;line-height:1.55}
.memo .meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--sub);font-size:12px;margin-top:6px;align-items:center}
.over{color:var(--red);font-weight:700}
.flag{background:#fdecea;color:var(--red);border-radius:6px;padding:1px 6px;font-size:11px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:6px 12px}
.seg button.on{background:var(--navy);color:#fff}
.grid2{display:grid;grid-template-columns:220px 1fr;gap:12px}
.brand{white-space:nowrap}header button{white-space:nowrap}
@media(max-width:760px){header .muted{display:none}header{padding:10px}}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.grid2,.cols2{grid-template-columns:1fr}}
.folders button{display:flex;justify-content:space-between;width:100%;margin-bottom:4px;text-align:left}
.folders button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f7f9fc;color:var(--sub);font-weight:600;position:sticky;top:0}
.tblwrap{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.tile b{display:block;font-size:24px;color:var(--navy)}
.bar{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.bar .tr{background:#eef1f6;border-radius:6px;height:16px;overflow:hidden}
.bar .fl{background:var(--navy);height:100%}
.up{color:var(--red)}.down{color:var(--green)}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,40,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;max-width:90vw}
.toast.err{background:var(--red)}
.login{max-width:360px;margin:12vh auto;background:#fff;border-radius:14px;padding:24px;border:1px solid var(--line)}
.login h1{font-size:18px;color:var(--navy);margin:0 0 4px}
.login input{width:100%;margin:6px 0}
.login button{width:100%;margin-top:8px}
.map{width:100%;height:560px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe}
.map text{font-size:12px;pointer-events:none}
.map .n{cursor:pointer}
.notice{background:#fff8e1;border:1px solid #ffe08a;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:11px}
textarea.quick{font-size:16px;line-height:28px;border:2px solid var(--navy);min-height:150px;padding:6px 12px;background:#fffef6 repeating-linear-gradient(transparent 0 27px,#eceff4 27px 28px);background-attachment:local;background-position:0 6px;resize:vertical}
.pad{width:100%;height:min(60vh,460px);border:1px solid var(--line);border-radius:10px;touch-action:none;display:block;cursor:crosshair}
.modal:has(.pad){max-width:900px}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(198,40,40,.0);background:#fff}50%{box-shadow:0 0 0 4px rgba(198,40,40,.35);background:#fff1f1}}
.memo.blink{animation:blink 1.4s ease-in-out infinite;border-left-width:6px}
@keyframes bellb{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.blink-bell{animation:bellb 1s ease-in-out infinite;background:#e53935!important}
@media (prefers-reduced-motion: reduce){.memo.blink,.blink-bell{animation:none}.memo.blink{background:#fff1f1}}
.staron{color:var(--red)!important;font-weight:700}
.age{border-radius:6px;padding:1px 6px;background:#eef1f6;font-weight:700;color:var(--sub)}
.age.mid{background:#fff3e0;color:#8a4b00}.age.old{background:#fdecea;color:var(--red)}
.patrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pat{background:#eef2f8;border-radius:8px;padding:4px 9px;font-size:12px;color:var(--navy);cursor:default}
.pat.warn{background:#fff3e0;color:#8a4b00}.pat.hot{background:#fdecea;color:var(--red)}.pat.ev{background:#e8f5e9;color:#1b5e20;cursor:pointer}
.simbox{background:#fffde7;border:1px solid #ffe08a;border-radius:10px;padding:8px 10px;margin-top:6px}
.simitem{padding:4px 0;cursor:pointer;font-size:13px;border-top:1px dashed #f0e2a8}.simitem:first-of-type{border-top:none}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:#f3f5f9}
.preview{max-width:100%;max-height:45vh;border-radius:10px;display:block;margin:0 auto 8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-h{text-align:center;font-weight:700;color:var(--sub);font-size:12px;padding:4px}
.cal-cell{min-height:92px;border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;background:#fff;overflow:hidden}
.cal-cell.dim{background:#f7f8fb;opacity:.6}.cal-cell.today{border:2px solid var(--navy)}.cal-cell.selday{background:#eef4ff}
.cal-d{font-weight:700;font-size:12px}
.cal-ev{color:#fff;border-radius:4px;padding:1px 4px;font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-rm{font-size:11px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cal-rm.over{color:var(--red);font-weight:700}.cal-rm.donex{text-decoration:line-through;opacity:.6}
.cal-n{font-size:10px;color:var(--sub);margin-top:2px}
@media(max-width:760px){.cal-cell{min-height:64px;padding:2px}.cal-ev,.cal-rm{font-size:9px}}

<body>

<script>
'use strict';
// ================= 설정 =================
// publishable 키는 공개용 키입니다(브라우저 노출 전제). 실제 권한은 DB의 로그인·역할 검사가 결정합니다.
const CFG = {
  url: 'https://ettopqmqnjzktdfygtuz.supabase.co',
  key: 'sb_publishable_2XOscbG2JvfZyCGKiwyj9g_8_4k5G-P',

// ================= DOM 헬퍼 (사용자 데이터는 항상 textContent로만 → XSS 차단) =================
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else if (k === 'selected') el.selected = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(9)) { if (c == null || c === false) continue; el.append(c instanceof Node ? c : String(c)); }
  return el;
}
function sv(tag, attrs, ...kids) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
  }
  for (const c of kids.flat(9)) { if (c == null) continue; el.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return el;
}
const $ = (s, r = document) => r.querySelector(s);
function put(el, ...kids) { el.replaceChildren(...kids.flat(9).filter(x => x != null && x !== false).map(x => x instanceof Node ? x : String(x))); }
function toast(msg, err) { const t = h('div', { class: 'toast' + (err ? ' err' : '') }, msg); document.body.append(t); setTimeout(() => t.remove(), err ? 5000 : 2200); }
function fmtDT(s) { if (!s) return ''; const d = new Date(s); return d.toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }); }
function fmtD(s) { if (!s) return ''; return new Date(s).toLocaleDateString('ko-KR'); }
function fmtSize(n) { if (!n) return ''; return n > 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.ceil(n / 1024) + 'KB'; }
function toLocalInput(d) { const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function modal(title, body, actions) {
  const bg = h('div', { class: 'modal-bg', onclick: e => { if (e.target === bg) bg.remove(); } });
  const close = () => bg.remove();
  bg.append(h('div', { class: 'modal' }, h('div', { class: 'row sb' }, h('h3', { style: 'margin:0;color:var(--navy)' }, title), h('button', { class: 'ghost', onclick: close }, '닫기')),
    h('div', { style: 'margin-top:10px' }, body), actions ? h('div', { class: 'row', style: 'justify-content:flex-end;margin-top:12px' }, actions(close)) : null));
  document.body.append(bg); return close;
}
function download(name, text, type) { const a = h('a', { href: URL.createObjectURL(new Blob([text], { type })), download: name }); document.body.append(a); a.click(); a.remove(); }

// ================= 인증·통신 (외부 라이브러리 없이 Supabase REST 직접 호출) =================
let S = null;
try { S = JSON.parse(sessionStorage.getItem('mso_s') || 'null'); } catch { S = null; }
function setSession(j) {
  S = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, email: j.user && j.user.email };
  sessionStorage.setItem('mso_s', JSON.stringify(S)); // 탭을 닫으면 사라짐 (localStorage 미사용)
}
function errMsg(j, fallback) {
  if (!j) return fallback;
  if (typeof j === 'string') return j;
  const m = j.message || j.error_description || j.msg || j.error || fallback;
  if (/MFA_REQUIRED/.test(m)) return '2단계 인증(OTP)이 필요합니다. 다시 로그인하세요.';
  if (/Unauthorized|42501/.test(m) || j.code === '42501') return '권한이 없습니다. 관리자에게 생산관리 권한을 요청하세요.';
  return m;
}
async function authCall(path, body) {
  const r = await fetch(CFG.url + '/auth/v1/' + path, { method: 'POST', headers: { apikey: CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(errMsg(j, '인증 실패'));
  return j;
}
async function login(email, pw) { setSession(await authCall('token?grant_type=password', { email, password: pw })); }
let refreshing = null;
async function token() {
  if (!S) throw new Error('로그인이 필요합니다');
  if (Date.now() > S.expires_at - 60000) {
    refreshing = refreshing || authCall('token?grant_type=refresh_token', { refresh_token: S.refresh_token }).then(setSession).finally(() => refreshing = null);
    try { await refreshing; } catch (e) { logout(true); throw e; }
  }
  return S.access_token;
}
async function rpc(fn, args) {
  const r = await fetch(`${CFG.url}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: CFG.key, Authorization: 'Bearer ' + await token(), 'Content-Type': 'application/json' }, body: JSON.stringify(args || {}) });
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch { j = t; }
  if (r.status === 401) { logout(true); throw new Error('세션이 만료되었습니다'); }
  if (!r.ok) throw new Error(errMsg(j, '요청 실패 (' + r.status + ')'));
  return j;
}
async function uploadFile(path, file, mime, bucket = CFG.bucket) {
  const r = await fetch(`${CFG.url}/storage/v1/object/${bucket}/${path}`, { method: 'POST', headers: { apikey: CFG.key, Authorization: 'Bearer ' + await token(), 'Content-Type': mime, 'x-upsert': 'false' }, body: file });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(errMsg(j, '업로드 실패'));
}
async function signedUrl(path, bucket = CFG.bucket) {
  const r = await fetch(`${CFG.url}/storage/v1/object/sign/${bucket}/${path}`, { method: 'POST', headers: { apikey: CFG.key, Authorization: 'Bearer ' + await token(), 'Content-Type': 'application/json' }, body: JSON.stringify({ expiresIn: 120 }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(errMsg(j, '열기 실패'));
  return CFG.url + '/storage/v1' + (j.signedURL || j.signedUrl);
}
async function logout(silent) {
  const tok = S && S.access_token; S = null; sessionStorage.removeItem('mso_s');
  if (tok) fetch(CFG.url + '/auth/v1/logout', { method: 'POST', headers: { apikey: CFG.key, Authorization: 'Bearer ' + tok } }).catch(() => {});
  clearInterval(ST.alertTimer);
  if (silent) toast('로그아웃되었습니다', true);
  renderLogin();
}
// 자리 비움 자동 로그아웃
let lastAct = Date.now();
['click', 'keydown', 'touchstart'].forEach(e => addEventListener(e, () => lastAct = Date.now(), { passive: true }));
setInterval(() => { if (S && Date.now() - lastAct > CFG.idleMinutes * 60000) logout(true); }, 30000);

// ================= 상태 =================
const ST = { boot: null, tab: 'main', composeId: null, mainStatus: 'open', mainTag: '', mf: { scope: 'mine', status: 'open', category: '', tag_id: '', q: '' }, folder: '', docQ: '', alerts: null, alertTimer: null, itk: null, period: 30, mapTag: '', calMonth: null, calDay: null, ev: null, sheetId: null };

function detectTags(text) { const u = (text || '').toUpperCase(); return tagsActive().filter(t => t.name.length >= 2 && u.includes(t.name.toUpperCase())); }

// ================= 로그인 =================
function renderLogin() {
  const app = $('#app'); put(app);
  const em = h('input', { type: 'email', placeholder: '이메일', autocomplete: 'username' });
  const pw = h('input', { type: 'password', placeholder: '비밀번호', autocomplete: 'current-password' });

    btn.disabled = true;
    try { await login(em.value.trim(), pw.value); pw.value = ''; await afterLogin(); }
    catch (e) { toast(e.message, true); } finally { btn.disabled = false; }
  };
  btn.onclick = go; pw.onkeydown = e => { if (e.key === 'Enter') go(); };

    h('div', { class: 'muted', style: 'margin-top:12px' }, '공용 PC에서는 사용 후 반드시 로그아웃하세요. ', CFG.idleMinutes + '분 동안 조작이 없으면 자동 로그아웃됩니다.')));
}

async function afterLogin() {
  const st = await rpc('office_security_status');
  if (!['admin', 'production'].includes(st.role)) { toast('생산관리 권한이 없는 계정입니다. 관리자에게 요청하세요.', true); return logout(); }
  if (st.has_mfa && st.aal !== 'aal2') return renderMfaLogin();
  if (!st.has_mfa && st.mfa_required) return renderMfaEnroll(true);
  return start();
}

  try { ST.boot = await rpc('office_bootstrap'); }
  catch (e) { if (/2단계/.test(e.message)) return renderMfaLogin(); toast(e.message, true); S = null; sessionStorage.removeItem('mso_s'); return renderLogin(); }
  renderShell(); loadAlerts();
  clearInterval(ST.alertTimer); ST.alertTimer = setInterval(loadAlerts, 60000);
}

// ================= 골격 =================
const TABS = [['main', '메인'], ['memo', '내 메모'], ['changes', '변경이력'], ['calendar', '달력'], ['events', '고객사 일정'], ['docs', '의뢰서·문서'], ['secure', '🔒 민감문서'], ['intake', '자료함'], ['sheets', '계산표'], ['analysis', '패턴분석'], ['map', '관계도'], ['settings', '설정']];

  app.append(
    h('header', null, h('span', { class: 'brand' }, '㈜엠솔루션 생산관리 오피스'), h('span', { class: 'sp' }),
      h('button', { class: 'bell', onclick: showAlerts, title: '알림' }, '🔔', bellBadge),

    h('nav', { id: 'nav' }, TABS.map(([k, l]) => h('button', { class: ST.tab === k ? 'on' : '', onclick: () => go(k) }, l))),
    h('main', { id: 'view' }));

  const v = $('#view'); put(v, h('div', { class: 'muted' }, '불러오는 중…'));

    .catch(e => { put(v, h('div', { class: 'card' }, '오류: ', e.message)); });
}

// ================= 알림 =================
const notified = new Set(JSON.parse(sessionStorage.getItem('mso_n') || '[]'));
async function loadAlerts() {
  try {
    ST.alerts = await rpc('office_alerts');
    const n = ST.alerts.overdue.length + ST.alerts.upcoming.length + ST.alerts.surge.length + (ST.alerts.events_soon || []).length;
    const b = $('#bellBadge'); if (b) { b.textContent = n; b.style.display = n ? '' : 'none'; b.parentNode.classList.toggle('blink-bell', ST.alerts.urgent_open > 0 || ST.alerts.overdue.length > 0); }

}
function showAlerts() {
  const a = ST.alerts || { overdue: [], upcoming: [], surge: [] };
  const item = (m, over) => h('div', { class: 'memo' + (m.priority ? ' p' + m.priority : ''), style: 'cursor:pointer', onclick: () => { close(); openMemoById(m.id); } },
    h('div', { class: 'body' }, m.body), h('div', { class: 'meta' }, h('span', { class: over ? 'over' : '' }, '⏰ ' + fmtDT(m.remind_at))));
  const close = modal('알림', h('div', null,
    h('h4', null, `시간 지남 (${a.overdue.length})`), a.overdue.length ? a.overdue.map(m => item(m, true)) : h('div', { class: 'muted' }, '없음'),
    h('h4', null, `24시간 내 (${a.upcoming.length})`), a.upcoming.length ? a.upcoming.map(m => item(m)) : h('div', { class: 'muted' }, '없음'),
    h('h4', null, `7일 내 고객사 일정 (${(a.events_soon || []).length})`), (a.events_soon || []).length ? a.events_soon.map(e => h('div', { class: 'row', style: 'margin:3px 0;cursor:pointer', onclick: () => { close(); go('events'); } }, h('b', null, dday(e.start_date)), e.start_date, e.customer || '', e.kind, e.title)) : h('div', { class: 'muted' }, '없음'),
    h('h4', null, `메모 반복 패턴 (${(a.memo_repeat || []).length})`), (a.memo_repeat || []).length ? a.memo_repeat.map(r => h('div', null, `🔁 ${r.tag}: 최근 2주 ${r.n}건 (직전 2주 ${r.prev}건)`)) : h('div', { class: 'muted' }, '없음'),
    h('h4', null, `패턴 경보: 최근 7일 급증 (${a.surge.length})`),

function drawPad(onFile) {
  const cv = h('canvas', { class: 'pad' }); const ctx = cv.getContext('2d');
  let size = 3, color = '#1d2433', drawing = false, last = null, inited = false; const undo = [];
  const fitc = () => { const r = cv.getBoundingClientRect(); const img = inited ? ctx.getImageData(0, 0, cv.width, cv.height) : null; inited = true;
    cv.width = Math.round(r.width * devicePixelRatio); cv.height = Math.round(r.height * devicePixelRatio);
    ctx.fillStyle = '#fffef6'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.strokeStyle = '#e3e7ee'; ctx.lineWidth = 1; for (let y = 40 * devicePixelRatio; y < cv.height; y += 40 * devicePixelRatio) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cv.width, y); ctx.stroke(); }
    if (img) ctx.putImageData(img, 0, 0); };
  const pt = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * devicePixelRatio, y: (e.clientY - r.top) * devicePixelRatio, p: e.pressure || .5 }; };
  cv.onpointerdown = e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); undo.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (undo.length > 30) undo.shift(); drawing = true; last = pt(e); };
  cv.onpointermove = e => { if (!drawing) return; const p = pt(e); ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = size * devicePixelRatio * (e.pointerType === 'pen' ? .5 + p.p : 1); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; };
  cv.onpointerup = cv.onpointercancel = () => { drawing = false; };

    h('button', { class: 'tl pri', onclick: e => { color = '#1d2433'; size = 3; mark(e); } }, '✒️ 검정'),

    h('button', { onclick: () => { const u = undo.pop(); if (u) ctx.putImageData(u, 0, 0); } }, '↶ 되돌리기'),
    h('button', { class: 'danger', onclick: () => { undo.push(ctx.getImageData(0, 0, cv.width, cv.height)); inited = false; fitc(); } }, '전체 지우기'));
  function mark(e) { bar.querySelectorAll('.tl').forEach(b => b.classList.remove('pri')); e.target.classList.add('pri'); }
  modal('✍️ 손글씨', h('div', null, bar, cv, h('div', { class: 'muted', style: 'margin-top:6px' }, '손가락·펜·마우스로 자유롭게 쓰세요. [메모에 붙이기]를 누르면 메모장에 그림으로 붙고, 위치·크기를 옮길 수 있습니다.')),

}

async function authApi(method, path, body) {
  const r = await fetch(CFG.url + '/auth/v1/' + path, { method, headers: { apikey: CFG.key, Authorization: 'Bearer ' + await token(), 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch { j = t; }
  if (!r.ok) throw new Error(errMsg(j, '인증 처리 실패 (' + r.status + ')'));
  return j;
}

async function mfaVerify(factorId, code) {
  const ch = await authApi('POST', `factors/${factorId}/challenge`);
  const s = await authApi('POST', `factors/${factorId}/verify`, { challenge_id: ch.id, code: String(code).replace(/\s/g, '') });
  setSession(s); // aal2 세션으로 교체
}
function otpInput(onDone) {
  const inp = h('input', { inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: 6, placeholder: '6자리', class: 'otp' });
  inp.oninput = () => { inp.value = inp.value.replace(/\D/g, '').slice(0, 6); if (inp.value.length === 6) onDone(inp.value, inp); };
  inp.onkeydown = e => { if (e.key === 'Enter' && inp.value.length === 6) onDone(inp.value, inp); };
  return inp;
}

  f.note.addEventListener('paste', e => { const fs = [...(e.clipboardData?.files || [])]; if (fs.length) { e.preventDefault(); add(fs, '캡처'); } });
  const pick = h('input', { type: 'file', multiple: true, accept: 'image/jpeg,image/png,image/webp,.pdf', capture: 'environment', style: 'display:none', onchange: e => { add([...e.target.files], '사진'); e.target.value = ''; } });
  const guide = h('div');
  const typeRow = h('div', { class: 'row', style: 'margin-bottom:8px' }, CHG_QUICK.map(([k, l]) => h('span', { class: 'chip typechip', 'data-k': k, onclick: () => setType(k) }, l)));
  function setType(k) {
    f.change_type.value = k; typeRow.querySelectorAll('.typechip').forEach(c => c.classList.toggle('sel', c.getAttribute('data-k') === k));
    put(guide, CHG_GUIDE[k] ? h('div', { class: 'notice' }, CHG_GUIDE[k]) : null);
    f.target.placeholder = k === '고객사중요변경' ? '고객사·라인 (예: 서연이화 KA4)' : k === '자산·책임인수' ? '인수 자산 (설비·금형·대차 등)' : '대상 (라인·설비, 선택)';
    drop.firstChild.textContent = k === '고객사중요변경' ? '📨 요청 메일 PDF·캡처·공문을 끌어놓거나, 이 칸을 누르고 Ctrl+V' : k === '자산·책임인수' ? '📦 인수 당시 상태 사진·인수인계서를 끌어놓거나, 이 칸을 누르고 Ctrl+V' : '📷 사진을 끌어놓거나, 이 칸을 누르고 Ctrl+V (변경 전·후 사진, 캡처)';
  }
  f.change_type.onchange = () => setType(f.change_type.value);
  // 쓰는 동안 비슷한 과거 이력 표시 (재발 감지)
  const simBox = h('div');
  const sim = debounce(async () => {
    const t = (f.target.value + ' ' + f.item.value + ' ' + f.note.value).trim(); if (t.length < 3) return put(simBox);
    try { const l = await rpc('office_chg_similar', { p_text: t, p_exclude: pre.corrected_from || null });
      put(simBox, l.length ? h('div', { class: 'simbox' }, h('div', { class: 'muted', style: 'margin-bottom:4px' }, '🕘 비슷한 과거 이력이 있습니다 (눌러서 확인)'),
        l.map(x => h('div', { class: 'simitem', onclick: () => chgOpen(x.id) }, chgBadge(x.type === '기타' ? '기록' : x.type), ' ', h('span', { class: 'muted' }, fmtYMD(x.effective_at) + ' · ' + x.doc_no + ' '), h('b', null, `${x.target} · ${x.item}`), x.note ? ' — ' + x.note : ''))) : null); } catch { }
  }, 600);
  [f.item, f.note, f.target].forEach(x => x.addEventListener('input', sim));
  const body = h('div', null, h('datalist', { id: 'chgT' }, allTargets.map(t => h('option', { value: t }))), itemList, typeRow, guide,
    pre.corrected_from ? h('div', { class: 'notice' }, `정정 등록 — 원본 ${pre.corrected_doc_no}은(는) 저장 후 무효 처리됩니다.`) : null,
    h('div', { class: 'row' }, f.item), h('div', { class: 'row', style: 'margin-top:6px' }, f.target, '적용 ', f.effective_at),
    h('div', { style: 'margin-top:6px' }, f.note), simBox,
    h('div', { style: 'margin-top:6px' }, drop, h('div', { class: 'row', style: 'margin-top:4px' }, h('button', { onclick: () => pick.click() }, '📷 촬영·파일'), pick), attBox),
    h('div', { style: 'margin-top:6px' }, detailBtn, detail));
  modal(pre.corrected_from ? '변경이력 정정 등록' : '변경 기록', body, c => [h('button', { onclick: c }, '취소'), h('button', {
    class: 'pri', onclick: async ev => {
      ev.target.disabled = true;
      try {
        const p = Object.fromEntries(Object.entries(f).map(([k, x]) => [k, x.value]));
        if (!p.item.trim()) { f.item.focus(); throw new Error('제목을 적어주세요'); }
        p.effective_at = p.effective_at ? new Date(p.effective_at).toISOString() : '';
        if (pre.memo_id) p.memo_id = pre.memo_id; if (pre.corrected_from) p.corrected_from = pre.corrected_from;
        if (p.change_type === '고객사중요변경' && !p.requester) p.requester = '고객사요청';
        if (['고객사중요변경', '자산·책임인수'].includes(p.change_type) && !pending.length && !p.evidence_ref.trim() && !confirm('증빙(메일 PDF·캡처·사진)이 붙어 있지 않습니다.\n증빙 없이 저장하면 「증빙 없음」으로 표시됩니다. 그래도 저장할까요?')) { ev.target.disabled = false; return; }
        const e = await rpc('office_chg_save', { p });
        const folder = ST.boot.folders.find(x => x.name === '변경이력');
        let fail = 0; for (const a of pending) { try { await uploadAttach(a.file, { chg_id: e.id, folder_id: folder ? folder.id : '', title: `${e.doc_no} ${a.file.name}`, note: `${e.target} ${e.item}` }); } catch (err) { fail++; toast(err.message, true); } }
        if (pre.corrected_from) { try { await rpc('office_chg_void', { p_id: pre.corrected_from, p_reason: `정정 → ${e.doc_no}` }); } catch (err) { toast('원본 무효 처리 실패: ' + err.message, true); } }
        c(); toast(`${e.doc_no} 기록됨${fail ? ` (사진 ${fail}건 실패)` : ''}`); if (ST.tab === 'changes') go('changes'); else loadAlerts();
      } catch (err) { toast(err.message, true); ev.target.disabled = false; }
    }
  }, '저장')]);
  document.querySelector('.modal-bg:last-of-type .modal').classList.add('wide');
  setType(f.change_type.value); if (pre.item || pre.note) sim();
  f.item.focus();
}

async function chgOpen(id) {
  const [e, imp] = await Promise.all([rpc('office_chg_get', { p_id: id }), rpc('office_chg_impact', { p_id: id })]);
  const photos = h('div'); if (e.photos.length) photoThumbs(e.photos).then(b => { b.querySelectorAll('img').forEach((img, i) => { img.style.cursor = 'pointer'; img.onclick = async () => window.open(await signedUrl(e.photos[i].file_path), '_blank', 'noopener'); }); photos.append(b); });
  const rows = [['제목', h('b', null, e.item)], ['대상', h('span', null, e.target + ' ', (e.tags || []).map(t => chip(t)))], ['내용', h('div', { style: 'white-space:pre-wrap' }, e.note || '-')], ['구분', h('span', null, e.change_type === '기타' ? '일반 기록' : chgBadge(e.change_type), e.m4 ? ` · 4M ${e.m4}` : '')], ...(e.after_value || e.before_value ? [['변경 값', chgValue(e)]] : []),
    ['적용', fmtDT(e.effective_at) + (e.first_lot ? ` · 첫 LOT ${e.first_lot}` : '')], ...(e.requester ? [['계기', e.requester]] : []), ...(e.evidence_ref ? [['근거', e.evidence_ref]] : []),
    ...(e.change_type === '4M변동점' ? [['원청 변동점 번호', e.official_no || h('span', { class: 'flag' }, '없음 — 보완 필요')]] : []),
    ['등록', `${e.author} · ${fmtDT(e.created_at)}${e.late_days > 1 ? ` (적용 ${e.late_days}일 후 등록)` : ''}`]];
  const delta = imp && (imp.before || imp.after) ? h('div', { class: 'card', style: 'margin-top:8px' }, h('h3', null, `변경 전후 7일 기록 비교 (자료함 · ${imp.target})`),
    h('div', null, `전 7일 ${imp.before}건 → 후 7일 `, h('b', { class: imp.after > imp.before ? 'up' : imp.after < imp.before ? 'down' : '' }, `${imp.after}건`)),
    imp.by_kind.map(k => h('div', { class: 'muted' }, `${k.k}: ${k.before} → ${k.after}`))) : h('div', { class: 'muted', style: 'margin-top:8px' }, '자료함에 이 대상의 전후 기록이 없어 비교할 수 없습니다.');
  modal(`${e.doc_no}${e.voided ? ' (무효)' : ''}`, h('div', null,
    e.needs_evidence ? h('div', { class: 'notice' }, '⚠ 증빙이 없습니다 — 요청 메일·사진을 [정정 등록]으로 붙이거나 [번호·근거 보완]에 근거를 적어 두세요.') : null,
    e.voided ? h('div', { class: 'notice' }, `무효 처리됨 · ${e.voided_by} · ${fmtDT(e.voided_at)} · 사유: ${e.void_reason}`) : null,
    imp && imp.same_item_recent >= 2 && e.change_type !== '정비교체' ? h('div', { class: 'notice' }, `⚠ 이 항목은 최근 30일 안에 ${imp.same_item_recent}번 바뀌었습니다 — 근본 원인 확인 필요`) : null,
    h('table', null, rows.map(([k, val]) => h('tr', null, h('th', { style: 'width:130px' }, k), h('td', null, val)))), photos, delta),
    c => [h('button', { class: 'ghost', onclick: () => { c(); chgCard(e.target); } }, `📇 ${e.target} 이력카드`),
      e.memo_id ? h('button', { class: 'ghost', onclick: () => { c(); openMemo(e.memo_id); } }, '원본 메모') : null,
      e.can_void ? h('button', { class: 'ghost', onclick: async () => {
        const on = prompt('원청 변동점 등록번호 / 근거를 보완합니다.\n원청 변동점 등록번호:', e.official_no || ''); if (on === null) return;
        try { await rpc('office_chg_amend', { p: { id: e.id, official_no: on } }); c(); toast('보완됨'); chgOpen(e.id); if (ST.tab === 'changes') go('changes'); } catch (err) { toast(err.message, true); } } }, '번호·근거 보완') : null,
      e.can_void ? h('button', { class: 'ghost', onclick: () => { c(); chgForm({ ...e, corrected_from: e.id, corrected_doc_no: e.doc_no }); } }, '정정 등록') : null,
      e.can_void ? h('button', { class: 'ghost danger', onclick: async () => { const r = prompt('무효 사유 (이력은 삭제되지 않고 무효로 남습니다):'); if (!r) return; try { await rpc('office_chg_void', { p_id: e.id, p_reason: r }); c(); toast('무효 처리됨'); go('changes'); } catch (err) { toast(err.message, true); } } }, '무효 처리') : null,
      h('button', { onclick: c }, '닫기')]);
}

async function chgCard(target) {
  const d = await rpc('office_chg_card', { p_target: target });
  modal(`📇 ${target} 이력카드`, h('div', null,
    h('h4', null, '현재 사양·상태'), h('table', null, h('tr', null, ['항목', '현재 값', '언제부터', '변경 횟수'].map(x => h('th', null, x))),
      d.items.map(i => h('tr', null, h('td', null, i.item), h('td', null, i.type === '정비교체' ? '🔧 최근 교체' : h('b', null, i.current || '')), h('td', null, fmtYMD(i.since)), h('td', null, i.n)))),
    h('h4', null, '전체 이력'), d.timeline.map(e => h('div', { class: 'tl' + (e.voided ? ' voided' : ''), onclick: () => chgOpen(e.id) },
      h('div', { class: 'tld' }, fmtYMD(e.effective_at)), h('div', null, chgBadge(e.change_type), ' ', h('b', null, e.item), ' ', chgValue(e), e.voided ? h('span', { class: 'flag' }, ' 무효') : null,
        h('div', { class: 'muted' }, `${e.doc_no} · ${e.requester || ''} · ${e.author}${e.official_no ? ' · 원청 ' + e.official_no : ''}`)))),
    h('div', { class: 'muted', style: 'margin-top:8px' }, '감사·SQ 대응 시 이 화면을 인쇄(Ctrl+P)하면 됩니다.')),
    c => [h('button', { onclick: () => window.print() }, '인쇄'), h('button', { onclick: c }, '닫기')]);
  document.querySelector('.modal-bg:last-of-type .modal').classList.add('wide');
}

async function chgAsOf() {
  const targets = ST.chgTargets || await rpc('office_chg_targets');
  const at = h('input', { type: 'date', value: toLocalInput(new Date()).slice(0, 10) });
  const tg = h('select', null, h('option', { value: '' }, '전체 대상'), targets.map(t => h('option', null, t.target)));
  const out = h('div');
  const run = async () => {
    const r = await rpc('office_chg_asof', { p: { at: at.value, target: tg.value } });
    put(out, r.rows.length ? h('table', null, h('tr', null, ['대상', '항목', `${r.at} 기준 값`, '언제부터', '근거번호', '그 다음 변경'].map(x => h('th', null, x))),
      r.rows.map(x => h('tr', null, h('td', null, x.target), h('td', null, x.item), h('td', null, h('b', null, x.value || '')), h('td', null, fmtYMD(x.since)),
        h('td', null, h('a', { href: '#', onclick: ev => { ev.preventDefault(); chgOpen(x.id); } }, x.doc_no)), h('td', { class: 'muted' }, x.next ? `${fmtYMD(x.next.at)} → ${x.next.value || '교체'}` : '-')))) : h('div', { class: 'muted' }, '그 날짜 이전 이력이 없습니다.'));
  };
  at.onchange = run; tg.onchange = run;
  modal('🕰 시점 조회 — 그날 어떤 사양이었나', h('div', null, h('div', { class: 'row', style: 'margin-bottom:8px' }, '날짜 ', at, tg, h('button', { class: 'pri', onclick: run }, '조회')),
    h('div', { class: 'muted', style: 'margin-bottom:8px' }, '클레임 LOT의 생산일을 넣으면, 그날 적용 중이던 사양과 이후 바뀐 내용이 나옵니다.'), out));
  document.querySelector('.modal-bg:last-of-type .modal').classList.add('wide');
  run();
}

async function chgCycles() {
  const list = await rpc('office_chg_cycles');
  modal('🔧 교환주기', list.length ? h('div', null, h('table', null, h('tr', null, ['대상', '항목', '횟수', '평균 주기', '최단~최장', '마지막', '다음 예상'].map(x => h('th', null, x))),
    list.map(x => h('tr', null, h('td', null, x.target), h('td', null, x.item), h('td', null, x.count), h('td', null, x.avg_days != null ? x.avg_days + '일' : '-'),
      h('td', { class: 'muted' }, x.min_days != null ? `${x.min_days}~${x.max_days}일` : '-'), h('td', null, fmtYMD(x.last)),
      h('td', { class: x.days_left != null && x.days_left <= 7 ? 'over' : '' }, x.next ? `${fmtYMD(x.next)} (${x.days_left >= 0 ? 'D-' + x.days_left : (-x.days_left) + '일 지남'})` : '2회째부터 계산')))),
    h('div', { class: 'muted', style: 'margin-top:8px' }, '「정비교체」로 등록된 이력 간격으로 계산합니다. 고장 교체와 정기 교체가 섞이면 평균이 흔들리니 계기를 정확히 골라주세요.'))
    : h('div', { class: 'muted' }, '「정비교체」 이력이 2건 이상 쌓이면 주기가 계산됩니다.'));
}

function chgBulk() {
  const ta = h('textarea', { rows: 10, placeholder: '엑셀에서 복사해 붙여넣기 (제목행 없이, 열 순서 고정)\n적용일\t대상\t항목\t이전값\t새값\t구분\t계기\t원청번호\t메모\n2026-11-01\tKA4\t바코드 용지 색상\t흰색\t노랑\t사양변경\t고객사요청\t\t서연이화 메일\n2026-11-03\t라벨프린터 1호기\t헤드\t\t신품\t정비교체\t고장·불량\t\t' });
  modal('변경이력 엑셀 붙여넣기 (기존 이력 이관)', h('div', null, ta, h('div', { class: 'muted' }, '열: 적용일 | 대상 | 항목 | 이전값 | 새값 | 구분(사양변경/4M변동점/정비교체/기타) | 계기 | 원청번호 | 메모 · 한 번에 500건')),
    c => [h('button', { onclick: c }, '취소'), h('button', { class: 'pri', onclick: async () => {
      const rows = parseDelimited(ta.value.trim(), '\t').filter(r => r.length >= 3 && r[1] && r[2]).map(r => {
        const m = String(r[0] || '').match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?/);
        const eff = m ? new Date(+m[1], +m[2] - 1, +m[3], m[4] ? +m[4] : 8, m[5] ? +m[5] : 0).toISOString() : '';
        return { effective_at: eff, target: r[1], item: r[2], before_value: r[3] || '', after_value: r[4] || '', change_type: CHG_TYPES.includes(r[5]) ? r[5] : '사양변경', requester: CHG_REQ.includes(r[6]) ? r[6] : '', official_no: r[7] || '', note: r[8] || '' };
      });
      if (!rows.length) return toast('읽을 행이 없습니다', true);
      if (rows.some(r => !r.effective_at) && !confirm('적용일을 읽지 못한 행은 오늘 날짜로 등록됩니다. 계속할까요?')) return;
      const res = await rpc('office_chg_bulk', { p: { rows } });
      c(); toast(`${res.ok}건 등록${res.errors.length ? ` · ${res.errors.length}건 실패 (${res.errors.slice(0, 3).map(x => x.row + '행: ' + x.error).join(', ')})` : ''}`, res.errors.length > 0); go('changes');
    } }, '등록')]);
}
